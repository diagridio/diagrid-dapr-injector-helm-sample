name: Global CI

on:
  workflow_dispatch:
  push:
    branches: 
    - main
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # TODO: remove once a chart containing diagridio/d3e#451 is released. Until
    # then the scheduler+actors entry cannot satisfy "no ClusterRoles", because
    # global.scheduler.mode is ignored by released charts and the scheduler's
    # cluster-scoped ClusterRole is always created.
    continue-on-error: ${{ matrix.allow_failure == true }}
    env:
      DIAGRID_TOKEN: ${{ secrets.DIAGRID_TOKEN }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Standalone - No CRDs
            d3e_target: d3e-standalone
            sample_target: sample
            check_crds: true
            check_cluster_roles: true

          - name: Standalone -  No CRDs & Sentry Automount Disabled
            d3e_target: d3e-standalone-sentry-automount-disabled
            sample_target: sample
            check_crds: true
            check_cluster_roles: true

          - name: With CRDs - No ClusterRoles
            d3e_target: d3e-with-crds-no-cluster-roles
            sample_target: sample-with-crds-no-cluster-roles
            check_crds: false
            check_cluster_roles: true
            
          - name: Minimal
            d3e_target: d3e-minimal
            sample_target: sample-minimal
            check_crds: false
            check_cluster_roles: false

          # Scheduler + actors enabled, but still no CRDs and no ClusterRoles.
          # Guards the two things that break this topology: the scheduler
          # dragging in a cluster-scoped ClusterRole, and the sidecar silently
          # getting no scheduler address (which leaves pods Ready but hangs
          # every workflow), hence the functional check below.
          - name: Standalone - No CRDs + Scheduler & Actors
            d3e_target: d3e-scheduler
            sample_target: sample-workflows
            check_crds: true
            check_cluster_roles: true
            build_workflow_image: true
            check_workflows: true
            allow_failure: true

    steps:
      - name:  checkout code
        uses: actions/checkout@v4

      - name: Validate DIAGRID_TOKEN secret
        run: |
          if [ -z "$DIAGRID_TOKEN" ]; then
            echo "DIAGRID_TOKEN is empty or not configured for this workflow run."
            echo "Set repository secret DIAGRID_TOKEN, or note that pull_request runs from forks cannot access repository secrets."
            exit 1
          fi

      - name: Install Dependencies (kind & Helm)
        run: |
          echo "Installing kind..."
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          echo "Installing Helm..."
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Make Infra
        run: make infra

      - name: Deploy Application
        run: make ${{ matrix.d3e_target }}

      - name: Verify DIAGRID_TOKEN override applied
        run: |
          if helm get values dapr -n d3e-sample -a | grep -q 'YOUR_D3E_TOKEN_HERE'; then
            echo "Placeholder token detected in effective Helm values."
            echo "Expected DIAGRID_TOKEN to be injected via --set-string diagrid.token."
            exit 1
          fi
          echo "DIAGRID_TOKEN override is applied."

      - name: Build workflow sample image into kind
        if: matrix.build_workflow_image
        run: make workflow-image-kind

      - name: Deploy Sample
        run: make ${{ matrix.sample_target }}

      - name: Wait for sample app to start
        run: sleep 60

      - name: Check pods are ready
        run: |
          kubectl wait --for=condition=Ready pods --all --namespace=d3e-sample --timeout=500s

      - name: Ensure no CRDs exist
        if: matrix.check_crds
        run: |
          if kubectl get crds -o name | grep -q .; then
            echo "CRDs found:"
            kubectl get crds
            exit 1
          else
            echo "✅ No CRDs found"
          fi

      - name: Ensure no Dapr ClusterRoles exist
        if: matrix.check_cluster_roles
        run: |
          if kubectl get clusterroles -o name | grep -q dapr; then
            echo "❌ Dapr ClusterRoles found:"
            kubectl get clusterroles | grep dapr
            exit 1
          else
            echo "✅ No Dapr ClusterRoles found"
          fi
      - name: Verify workflows actually run
        if: matrix.check_workflows
        run: |
          set -euo pipefail
          kubectl port-forward -n d3e-sample deploy/service-workflow 8080:8080 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf --max-time 2 localhost:8080/health >/dev/null 2>&1 && break
            sleep 2
          done

          status_of() {
            curl -s --max-time 5 "localhost:8080/orders/$1" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])'
          }
          await_completed() {
            for i in $(seq 1 40); do
              s=$(status_of "$1" || echo pending)
              [ "$s" = "ORCHESTRATION_STATUS_COMPLETED" ] && return 0
              [ "$s" = "ORCHESTRATION_STATUS_FAILED" ] && { echo "workflow $1 FAILED"; return 1; }
              sleep 3
            done
            echo "workflow $1 did not complete, last status: ${s:-unknown}"
            kubectl logs -n d3e-sample -l app=service-workflow -c daprd --tail=80 || true
            return 1
          }

          echo "--- immediate workflow ---"
          ID=$(curl -sf --max-time 30 -X POST localhost:8080/orders \
            -H 'Content-Type: application/json' -d '{"item_name":"cars","quantity":1}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          await_completed "$ID"
          echo "✅ workflow $ID completed"

          # A delayed start is fired by the scheduler, so this fails outright if
          # the sidecar has no scheduler address.
          echo "--- delayed start (15s) ---"
          ID=$(curl -sf --max-time 30 -X POST 'localhost:8080/orders?delaySeconds=15' \
            -H 'Content-Type: application/json' -d '{"item_name":"computers","quantity":1}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          sleep 5
          EARLY=$(status_of "$ID")
          if [ "$EARLY" = "ORCHESTRATION_STATUS_COMPLETED" ]; then
            echo "❌ delayed workflow completed early; start time was not honoured"
            exit 1
          fi
          echo "still $EARLY after 5s, as expected"
          await_completed "$ID"
          echo "✅ delayed workflow $ID completed"

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== pods ==="
          kubectl get pods -n d3e-sample -o wide || true
          echo "=== not-ready pods: describe + logs ==="
          for p in $(kubectl get pods -n d3e-sample -o json \
              | python3 -c 'import sys,json;[print(i["metadata"]["name"]) for i in json.load(sys.stdin)["items"] if any(not c.get("ready") for c in i.get("status",{}).get("containerStatuses",[]))]'); do
            echo "----- describe $p -----"
            kubectl describe pod "$p" -n d3e-sample | tail -30 || true
            for c in $(kubectl get pod "$p" -n d3e-sample -o jsonpath='{.spec.containers[*].name}'); do
              echo "----- logs $p/$c -----"
              kubectl logs "$p" -c "$c" -n d3e-sample --tail=60 || true
              echo "----- previous logs $p/$c -----"
              kubectl logs "$p" -c "$c" -n d3e-sample --previous --tail=40 2>/dev/null || true
            done
          done
          echo "=== cluster-scoped RBAC ==="
          kubectl get clusterrole,clusterrolebinding | grep -i dapr || echo "none"

      - name: Show all pods
        if: always()
        run: kubectl get pods --all-namespaces
      - name: Nuke resources 
        if: always()
        run: make nuke