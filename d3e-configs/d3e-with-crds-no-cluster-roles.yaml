# Namespaced D3E Configuration with CRDs
# This configuration uses namespaced RBAC but still uses CRDs
# This is a hybrid approach - CRDs are cluster-scoped but RBAC is namespaced
# Note: This may not work in all environments due to CRD cluster-scoping

global:
  tag: "1.15.6-d3e.1"
  mtls:
    enabled: true
  actors:
    enabled: false
  scheduler:
    enabled: false
  rbac:
    namespaced: true
    namespaces: ["d3e-sample"]
    injector:
      enabled: false
    createTokenReviewerRole: false
    createTokenReviewerRoleBinding: false

# D3E token (replace with your actual token)
diagrid:
  token: "YOUR_D3E_TOKEN_HERE"

dapr_operator:
  enabled: false

dapr_sidecar_injector:
  enabled: false

dapr_sentry:
  mode: "standalone"
  injectDaprSystemConfig: true

dapr_config:
  dapr_config_chart_included: true 

namespace: "d3e-sample"