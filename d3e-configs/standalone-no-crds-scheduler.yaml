# Standalone D3E configuration without CRDs, WITH actors + scheduler.
#
# Same shape as standalone-no-crds.yaml, but actors and the scheduler are
# enabled. Required by everything scheduler-backed:
#
#   - Workflows. The engine runs on the actor runtime and drives all execution
#     through scheduler-backed reminders, so durable timers and
#     delayed/scheduled starts simply never fire without it.
#   - Actor reminders.
#   - The Jobs API.
#
# REQUIRES `global.scheduler.mode: standalone`. In the released charts the
# scheduler's cluster-scoped ClusterRole (`namespaces` get/list/watch) is tied to
# `global.scheduler.enabled` alone, so simply enabling the scheduler reintroduces
# a ClusterRole and breaks the point of this configuration. The standalone mode
# gate that omits that ClusterRole is added by:
#   https://github.com/diagridio/d3e/pull/451
# Until that ships, use a chart build containing it.

global:
  tag: "1.18.2-d3e.1"
  mtls:
    enabled: true
  actors:
    enabled: true
  scheduler:
    enabled: true
    # The scheduler only needs the cluster-scoped `namespaces` ClusterRole in
    # kubernetes mode, where it garbage-collects jobs for deleted namespaces.
    # Standalone mode never starts that controller, so no ClusterRole is needed.
    mode: standalone
  rbac:
    namespaced: true
    namespaces: ["d3e-sample"]
    injector:
      enabled: false
    createTokenReviewerRole: false
    createTokenReviewerRoleBinding: false
    crds:
      enabled: false
    operator:
      enabled: false
    sentry:
      serviceAccount:
        create: true

# D3E token (replace with your actual token)
diagrid:
  token: "YOUR_D3E_TOKEN_HERE"

dapr_operator:
  enabled: false

dapr_sidecar_injector:
  enabled: false

dapr_placement:
  mode: "standalone"

dapr_scheduler:
  # 16Gi is the production default; 1Gi is plenty for a local sample cluster.
  cluster:
    storageSize: 1Gi

dapr_sentry:
  mode: "standalone"
  injectDaprSystemConfig: true

dapr_config:
  dapr_config_chart_included: false

namespace: "d3e-sample"
