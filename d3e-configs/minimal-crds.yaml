# Minimal D3E Configuration with CRDs
# This is the basic deployment method with cluster-wide permissions
# Use this for development and testing environments

# Global settings
global:
  tag: "1.15.5"
  mtls:
    enabled: true
  actors:
    enabled: false
  scheduler:
    enabled: false
  rbac:
    namespaced: false  # Use cluster-wide RBAC
    injector:
      enabled: true
    createTokenReviewerRole: true
    createTokenReviewerRoleBinding: true

# D3E token (replace with your actual token)
diagrid:
  token: "YOUR_D3E_TOKEN_HERE"

# Dapr control plane components
dapr_operator:
  enabled: true

dapr_sidecar_injector:
  enabled: true

dapr_placement:
  mode: "kubernetes"  # Use Kubernetes mode with CRDs

dapr_scheduler:
  mode: "kubernetes"  # Use Kubernetes mode with CRDs

dapr_sentry:
  mode: "kubernetes"  # Use Kubernetes mode with CRDs
  injectDaprSystemConfig: true

# Dapr configuration
dapr_config:
  dapr_config_chart_included: true  # Include default Dapr config

# Namespace configuration
namespace: "d3e-sample" 