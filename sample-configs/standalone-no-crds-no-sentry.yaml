# Standalone Sample Configuration without mTLS for Sentry service.
replicaCount: 1
image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

dapr:
  image:
    tag: "1.14.5-d3e.1"
    pullPolicy: IfNotPresent
  controlPlaneNamespace: "d3e-sample" # default is Release.Namespace (ie dapr-system)
  mtls:
    enabled: false
  sentry:
    enabled: false
  actors:
    enabled: false
  scheduler:
    enabled: false

podAnnotationsSub: 
  dapr.io/app-id: service-sub
  dapr.io/enable-api-logging: "false"
  dapr.io/enabled: "true"
  dapr.io/log-as-json: "false"
  dapr.io/app-port: "8080"
  dapr.io/placement-host-address: ' '
  dapr.io/scheduler-host-address: ' '

podAnnotationsPub: 
  dapr.io/app-id: service-pub
  dapr.io/enable-api-logging: "false"
  dapr.io/enabled: "true"
  dapr.io/log-as-json: "false"
  dapr.io/app-port: "8080"
  dapr.io/placement-host-address: ' '
  dapr.io/scheduler-host-address: ' '

podLabels: {}
podSecurityContext: {}
securityContext: {}

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

diagrid_dapr_injector:
  enabled: true
  mode: "standalone"
  injectDaprResources: true
  configurationFiles:
    - config.yaml