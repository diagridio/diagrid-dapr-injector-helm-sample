replicaCount: 1
image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

dapr:
  image:
    tag: "1.15.5"
    pullPolicy: IfNotPresent
  controlPlaneNamespace: "d3e-sample" # default is Release.Namespace (ie dapr-system)

podAnnotations: 
  dapr.io/app-id: service-dapr-system-x
  dapr.io/enable-api-logging: "true"
  dapr.io/enabled: "true"
  dapr.io/log-as-json: "false"
  dapr.io/log-level: debug

podAnnotationsSub: 
  dapr.io/app-id: service-sub
  dapr.io/enable-api-logging: "true"
  dapr.io/enabled: "true"
  dapr.io/log-as-json: "false"
  dapr.io/log-level: debug
  dapr.io/app-port: "8080"

podAnnotationsPub: 
  dapr.io/app-id: service-pub
  dapr.io/enable-api-logging: "true"
  dapr.io/enabled: "true"
  dapr.io/log-as-json: "false"
  dapr.io/log-level: debug
  dapr.io/app-port: "8080"

podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

diagrid_dapr_injector:
  enabled: false
  mode: "kubernetes"
  injectDaprResources: false