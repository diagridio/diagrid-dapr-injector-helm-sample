# Default values for deploy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

dapr:
  image:
    tag: "1.16.14-d3e.5"
    pullPolicy: IfNotPresent
  controlPlaneNamespace: "d3e-sample" # default is Release.Namespace (ie dapr-system)

podAnnotations: 
  dapr.io/app-id: service-dapr-system-x
  dapr.io/enable-api-logging: "true"
  dapr.io/enabled: "true"
  dapr.io/log-as-json: "false"
  dapr.io/log-level: debug
  dapr.io/placement-host-address: ' '
  dapr.io/scheduler-host-address: ' '

podAnnotationsSub: 
  dapr.io/app-id: service-sub
  dapr.io/enable-api-logging: "true"
  dapr.io/enabled: "true"
  dapr.io/log-as-json: "false"
  dapr.io/log-level: debug
  dapr.io/app-port: "8080"
  dapr.io/placement-host-address: ' '
  dapr.io/scheduler-host-address: ' '

podAnnotationsPub: 
  dapr.io/app-id: service-pub
  dapr.io/enable-api-logging: "true"
  dapr.io/enabled: "true"
  dapr.io/log-as-json: "false"
  dapr.io/log-level: debug
  dapr.io/app-port: "8080"
  dapr.io/placement-host-address: ' '
  dapr.io/scheduler-host-address: ' '

podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}


diagrid_dapr_injector:
  mode: "standalone"
  injectDaprResources: true
  configurationFiles:
    - config.yaml