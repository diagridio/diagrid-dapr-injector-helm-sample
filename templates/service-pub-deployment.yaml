apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-pub
  namespace: {{.Release.Namespace}}
  labels:
    app: service-pub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-pub
  template:
    metadata:
      annotations:
        {{ toYaml .Values.podAnnotationsPub | nindent 8 | trim}}
      labels:
        app: service-pub
        dapr.io/app-id: service-pub
        dapr.io/metrics-enabled: "true"
        dapr.io/sidecar-injected: "true"
    spec:
      containers:
      - name: service-pub
        image: nelsonparente00/pub-fcf22dc88fe149679f05d1e44b8eea63:latest
        imagePullPolicy: Always
        env:
        - name: DAPR_HTTP_PORT
          value: "3500"
        - name: DAPR_GRPC_PORT
          value: "50001"
        - name: APP_PROTOCOL
          value: http
      {{- include "diagrid.dapr.sidecar" (dict "podAnnotations" .Values.podAnnotationsPub "helmCtx" .) | indent 6 }}
      volumes:
      {{- include "diagrid.dapr.identity-token-volume" . | indent 6 }}
      {{- if .Values.diagrid_dapr_injector.injectDaprResources }}
      {{- include "diagrid.dapr.resources-volumes" (dict "podAnnotations" .Values.podAnnotationsPub "helmCtx" .) | indent 6 }}
      {{- end }}
